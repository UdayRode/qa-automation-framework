[tool.pytest.ini_options]
addopts = "-v --strict-markers --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure"
markers = [
    "smoke: quick critical tests",
    "regression: full test suite",
]
base_url = "https://www.saucedemo.com"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Session-scoped fixtures defined as instance methods",
]